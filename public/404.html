<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>404 | Ali Ahmed Co</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Manrope", system-ui, sans-serif;
        --bg: #eee6da;
        --panel: rgba(248, 242, 233, 0.94);
        --ink: #201c18;
        --muted: #6f665f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
        background:
          radial-gradient(circle at top left, rgba(255,255,255,0.78), transparent 26%),
          linear-gradient(180deg, #efe7dc 0%, #eadfce 52%, #e3d7c8 100%);
        color: var(--ink);
      }
      main {
        width: min(760px, 100%);
        padding: 40px;
        border-radius: 32px;
        background: var(--panel);
        border: 1px solid rgba(255,255,255,0.72);
        box-shadow: 0 26px 60px rgba(54, 40, 31, 0.12);
        text-align: center;
      }
      p {
        color: var(--muted);
        line-height: 1.7;
      }
      .eyebrow {
        margin: 0 0 10px;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        font-size: 12px;
      }
      h1 {
        margin: 0;
        font-family: Georgia, serif;
        font-size: clamp(3rem, 8vw, 5rem);
        line-height: 0.95;
      }
      a {
        display: inline-block;
        margin-top: 10px;
        color: inherit;
        text-underline-offset: 0.16em;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">404</p>
      <h1>This picture slipped out of the stack.</h1>
      <p>The page you wanted wandered off somewhere between the contact sheet and the cutting room floor.</p>
      <a href="/">Return to Ali Ahmed Co</a>
    </main>
  </body>
</html>
